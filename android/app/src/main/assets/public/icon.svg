<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="flOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="50%" stop-color="#ff5400"/>
      <stop offset="100%" stop-color="#e03000"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#252b3d" stroke-width="6"/>

  <!-- Waveform / Equalizer Bars -->
  <g transform="translate(64, 256)" opacity="0.25">
    <rect x="0" y="-80" width="16" height="160" rx="8" fill="#ff7a18"/>
    <rect x="32" y="-120" width="16" height="240" rx="8" fill="#ff7a18"/>
    <rect x="64" y="-60" width="16" height="120" rx="8" fill="#ff7a18"/>
    <rect x="304" y="-70" width="16" height="140" rx="8" fill="#22d3ee"/>
    <rect x="336" y="-130" width="16" height="260" rx="8" fill="#22d3ee"/>
    <rect x="368" y="-90" width="16" height="180" rx="8" fill="#22d3ee"/>
  </g>

  <!-- Central Stylized FL Flame / Fruit Motif -->
  <path d="M256 96 C290 140 350 210 350 280 C350 346 308 396 256 396 C204 396 162 346 162 280 C162 210 222 140 256 96 Z" fill="url(#flOrange)"/>
  
  <!-- Stem / Sprout -->
  <path d="M256 96 C256 60 285 46 304 42 C295 56 288 74 276 88 Z" fill="#10b981"/>
  <path d="M256 96 C250 64 230 52 214 48 C224 60 230 76 240 88 Z" fill="#34d399"/>

  <!-- Soundwave cutouts in the center of the flame -->
  <rect x="220" y="250" width="12" height="60" rx="6" fill="#141722"/>
  <rect x="244" y="220" width="12" height="120" rx="6" fill="#ffffff"/>
  <rect x="268" y="235" width="12" height="90" rx="6" fill="#141722"/>
  <rect x="292" y="260" width="12" height="40" rx="6" fill="#141722"/>

  <!-- Audio Studio Badge -->
  <rect x="176" y="420" width="160" height="28" rx="14" fill="#1a1f2e" stroke="#06b6d4" stroke-width="2"/>
  <text x="256" y="439" text-anchor="middle" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="3">FL MOBILE</text>
</svg>
