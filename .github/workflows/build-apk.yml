name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Production Distribution
        run: npm run build

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize & Sync Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # If android directory exists without a gradlew script, backup and re-initialize
          if [ -d "android" ] && [ ! -f "android/gradlew" ]; then
            mv android android-legacy || true
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output Directory
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          echo "Generated APK files:"
          ls -lh output-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FL-Studio-Mobile-APK
          path: output-apk/*.apk
          retention-days: 30
